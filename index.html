<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP CONTROL SUBSANACION DE PENDIENTES MENNAR</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse CDN para lectura eficiente de CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- ENCABEZADO -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold uppercase tracking-wide">App Control Subsanacion de Pendientes Mennar</h1>
    </header>

    <!-- PANEL PRINCIPAL -->
    <main class="p-4 max-w-[1600px] mx-auto space-y-4">

        <!-- CONTROLES DE CARGA MANUAL -->
        <div class="bg-white p-4 rounded shadow-sm border border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
            <div>
                <label class="block font-bold text-gray-700 mb-1">1. Cargar Archivo de Pendientes (CSV / Excel):</label>
                <div class="flex gap-2">
                    <input type="file" id="inputPendientes" accept=".csv, .xlsx, .xls" class="border p-1 w-full rounded">
                    <button onclick="cargarManualPendientes()" class="bg-blue-600 text-white px-3 py-1 rounded font-bold hover:bg-blue-700 transition">Procesar</button>
                </div>
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">2. Cargar Archivo de Inventario (CSV / Excel):</label>
                <div class="flex gap-2">
                    <input type="file" id="inputInventario" accept=".csv, .xlsx, .xls" class="border p-1 w-full rounded">
                    <button onclick="cargarManualInventario()" class="bg-blue-600 text-white px-3 py-1 rounded font-bold hover:bg-blue-700 transition">Cargar Stock</button>
                </div>
            </div>
        </div>

        <!-- ACCIONES Y ACCIONES RAPIDAS -->
        <div class="flex flex-wrap justify-end gap-2 text-xs">
            <button onclick="exportarCSVCompleto()" class="bg-emerald-600 text-white px-3 py-1.5 rounded font-bold hover:bg-emerald-700 transition">⬇ Exportar CSV Completo (32 Campos Solicitados)</button>
            <button onclick="restablecerDatos()" class="bg-red-500 text-white px-3 py-1.5 rounded font-bold hover:bg-red-600 transition">🗑 Restablecer / Borrar Datos</button>
        </div>

        <!-- FILTROS DE BÚSQUEDA Y SELECCIÓN -->
        <div class="bg-white p-4 rounded shadow-sm border border-gray-200 space-y-3 text-xs">
            <h2 class="font-bold text-sm text-gray-700 border-b pb-1">Filtros y Ordenamiento</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-8 gap-2">
                <div>
                    <label class="block font-semibold mb-1">Búsqueda General:</label>
                    <input type="text" id="filtroGeneral" placeholder="Cédula, Nombre, Documento" oninput="aplicarFiltros()" class="border p-1 w-full rounded">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Ordenar Por:</label>
                    <select id="ordenarPor" onchange="aplicarFiltros()" class="border p-1 w-full rounded">
                        <option value="fecha_asc">Fecha Origen (Más Antiguo)</option>
                        <option value="fecha_desc">Fecha Origen (Más Reciente)</option>
                        <option value="paciente">Nombre Paciente</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Mes Dispensación:</label>
                    <select id="filtroMes" onchange="aplicarFiltros()" class="border p-1 w-full rounded">
                        <option value="">-- Todos --</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Bodega / Punto:</label>
                    <select id="filtroBodega" onchange="aplicarFiltros()" class="border p-1 w-full rounded">
                        <option value="">-- Todas --</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Cliente / EPS:</label>
                    <select id="filtroCliente" onchange="aplicarFiltros()" class="border p-1 w-full rounded">
                        <option value="">-- Todos los Clientes --</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Inv. Origen:</label>
                    <select id="filtroInvOrigen" onchange="aplicarFiltros()" class="border p-1 w-full rounded">
                        <option value="">-- Todo el Inventario --</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Inv. Bod. Pendientes NEPS:</label>
                    <select id="filtroInvNEPS" onchange="aplicarFiltros()" class="border p-1 w-full rounded">
                        <option value="">-- Toda Bod. Pendientes --</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Inv. CEDI Principal:</label>
                    <select id="filtroInvCEDI" onchange="aplicarFiltros()" class="border p-1 w-full rounded">
                        <option value="">-- Todo CEDI --</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- TABLA DE REGISTROS -->
        <div class="bg-white rounded shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-2 bg-gray-50 border-b flex justify-between items-center text-xs">
                <button onclick="descargarFiltroActual()" class="bg-blue-600 text-white px-2.5 py-1 rounded font-bold hover:bg-blue-700">💾 Descargar Filtro Actual (CSV/Excel)</button>
                <span id="contadorRegistros" class="font-bold text-gray-600">Mostrando: 0 de 0 registros</span>
            </div>
            
            <div class="overflow-x-auto custom-scrollbar max-h-[600px]">
                <table class="w-full text-left text-[11px] border-collapse min-w-[1200px]">
                    <thead class="bg-gray-100 sticky top-0 border-b font-bold text-gray-700">
                        <tr>
                            <th class="p-2 border-r">Mes</th>
                            <th class="p-2 border-r">Documento</th>
                            <th class="p-2 border-r">Fecha Origen</th>
                            <th class="p-2 border-r">Bodega</th>
                            <th class="p-2 border-r">Cliente / EPS</th>
                            <th class="p-2 border-r">Cédula</th>
                            <th class="p-2 border-r">Paciente</th>
                            <th class="p-2 border-r">Medicamento</th>
                            <th class="p-2 border-r">Código Art.</th>
                            <th class="p-2 border-r">Cant. Pend.</th>
                            <th class="p-2 border-r">Inv. Origen</th>
                            <th class="p-2 border-r">Inv. Bod. Pendientes</th>
                            <th class="p-2 border-r">Inv. CEDI</th>
                            <th class="p-2 border-r">Estado Subsanación</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo" class="divide-y divide-gray-200">
                        <!-- Filas dinámicas -->
                    </tbody>
                </table>
            </div>
            
            <!-- PAGINACIÓN -->
            <div class="p-2 bg-gray-50 border-t flex justify-between items-center text-xs">
                <button onclick="paginaAnterior()" class="px-3 py-1 border rounded bg-white hover:bg-gray-100">⬅ Anterior</button>
                <span id="indicadorPagina" class="font-semibold">Página 1 de 1</span>
                <button onclick="paginaSiguiente()" class="px-3 py-1 border rounded bg-white hover:bg-gray-100">Siguiente ➡️</button>
            </div>
        </div>

    </main>

    <script>
        // RUTAS AUTOMÁTICAS RAW DE GITHUB
        const URL_PENDIENTES = "https://raw.githubusercontent.com/analistadatos-jpg/control-pendientes-Mennar/main/Total_Dispensacion_Pendientes_Activos.csv";
        const URL_INVENTARIO = "https://raw.githubusercontent.com/analistadatos-jpg/control-pendientes-Mennar/main/inventario.csv";

        let datosPendientes = [];
        let datosInventario = [];
        let datosFiltrados = [];
        let paginaActual = 1;
        const registrosPorPagina = 50;

        // INICIALIZACIÓN Y CARGA AUTOMÁTICA
        window.addEventListener('DOMContentLoaded', () => {
            cargarArchivosAutomaticos();
        });

        function cargarArchivosAutomaticos() {
            // Cargar Pendientes
            Papa.parse(URL_PENDIENTES, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    datosPendientes = results.data;
                    // Cargar Inventario tras pendientes
                    Papa.parse(URL_INVENTARIO, {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        complete: function(invResults) {
                            datosInventario = invResults.data;
                            poblardesplegables();
                            aplicarFiltros();
                        }
                    });
                }
            });
        }

        function poblardesplegables() {
            const meses = [...new Set(datosPendientes.map(item => item["Mes"] || item["MES"]))].filter(Boolean);
            const bodegas = [...new Set(datosPendientes.map(item => item["Bodega"] || item["BODEGA"]))].filter(Boolean);
            const clientes = [...new Set(datosPendientes.map(item => item["Cliente"] || item["CLIENTE"]))].filter(Boolean);

            llenarSelect("filtroMes", meses);
            llenarSelect("filtroBodega", bodegas);
            llenarSelect("filtroCliente", clientes);
        }

        function llenarSelect(id, opciones) {
            const select = document.getElementById(id);
            select.innerHTML = select.options[0].outerHTML;
            opciones.sort().forEach(op => {
                const opt = document.createElement('option');
                opt.value = op;
                opt.textContent = op;
                select.appendChild(opt);
            });
        }

        function aplicarFiltros() {
            const general = document.getElementById("filtroGeneral").value.toLowerCase();
            const mes = document.getElementById("filtroMes").value;
            const bodega = document.getElementById("filtroBodega").value;
            const cliente = document.getElementById("filtroCliente").value;

            datosFiltrados = datosPendientes.filter(item => {
                const textoFila = Object.values(item).join(" ").toLowerCase();
                const cumpleGeneral = !general || textoFila.includes(general);
                const cumpleMes = !mes || (item["Mes"] || item["MES"]) === mes;
                const cumpleBodega = !bodega || (item["Bodega"] || item["BODEGA"]) === bodega;
                const cumpleCliente = !cliente || (item["Cliente"] || item["CLIENTE"]) === cliente;

                return cumpleGeneral && cumpleMes && cumpleBodega && cumpleCliente;
            });

            paginaActual = 1;
            renderizarTabla();
        }

        function renderizarTabla() {
            const tbody = document.getElementById("tablaCuerpo");
            tbody.innerHTML = "";

            const inicio = (paginaActual - 1) * registrosPorPagina;
            const fin = inicio + registrosPorPagina;
            const paginados = datosFiltrados.slice(inicio, fin);

            paginados.forEach(row => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-blue-50";
                tr.innerHTML = `
                    <td class="p-2 border-r">${row["Mes"] || row["MES"] || ''}</td>
                    <td class="p-2 border-r">${row["Documento"] || row["DOCUMENTO"] || ''}</td>
                    <td class="p-2 border-r">${row["Fecha Origen"] || row["FECHA ORIGEN"] || ''}</td>
                    <td class="p-2 border-r">${row["Bodega"] || row["BODEGA"] || ''}</td>
                    <td class="p-2 border-r">${row["Cliente"] || row["CLIENTE"] || ''}</td>
                    <td class="p-2 border-r">${row["Cédula"] || row["CEDULA"] || ''}</td>
                    <td class="p-2 border-r">${row["Paciente"] || row["PACIENTE"] || ''}</td>
                    <td class="p-2 border-r">${row["Medicamento"] || row["MEDICAMENTO"] || ''}</td>
                    <td class="p-2 border-r">${row["Código Art."] || row["CODIGO ART."] || ''}</td>
                    <td class="p-2 border-r font-bold">${row["Cant. Pend."] || row["CANT. PEND."] || '0'}</td>
                    <td class="p-2 border-r text-gray-500">0</td>
                    <td class="p-2 border-r text-gray-500">0</td>
                    <td class="p-2 border-r text-gray-500">0</td>
                    <td class="p-2 border-r"><span class="bg-yellow-100 text-yellow-800 px-1.5 py-0.5 rounded font-bold">Pendiente</span></td>
                `;
                tbody.appendChild(tr);
            });

            // Actualizar contadores
            document.getElementById("contadorRegistros").innerText = `Mostrando: ${datosFiltrados.length} registros`;
            const totalPaginas = Math.ceil(datosFiltrados.length / registrosPorPagina) || 1;
            document.getElementById("indicadorPagina").innerText = `Página ${paginaActual} de ${totalPaginas}`;
        }

        function paginaAnterior() {
            if (paginaActual > 1) {
                paginaActual--;
                renderizarTabla();
            }
        }

        function paginaSiguiente() {
            const totalPaginas = Math.ceil(datosFiltrados.length / registrosPorPagina);
            if (paginaActual < totalPaginas) {
                paginaActual++;
                renderizarTabla();
            }
        }

        function restablecerDatos() {
            datosPendientes = [];
            datosInventario = [];
            datosFiltrados = [];
            renderizarTabla();
        }
    </script>
</body>
</html>
